<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBET</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Arial}
    body{background:#0a0a0a;color:white;padding-bottom:120px}
    .header{background:#E10600;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
    .logo{font-size:22px;font-weight:900}
    .btn{background:white;color:#E10600;padding:7px 14px;border-radius:20px;border:none;font-weight:700;font-size:13px;margin-left:5px}
    .balance{background:#000;padding:7px 14px;border-radius:20px;font-weight:700}
    .nav{display:flex;background:#141414;overflow-x:auto}
    .nav-item{padding:14px 12px;white-space:nowrap;color:#888;font-weight:600}
    .nav-item.active{color:#00FF88;border-bottom:2px solid #00FF88}
    .tabs{display:flex;padding:10px;gap:8px}
    .tab{flex:1;padding:10px;text-align:center;background:#1a1a1a;border-radius:8px;font-weight:700;font-size:13px}
    .tab.active{background:#E10600}
    .match-card{background:#141414;margin:10px;border-radius:12px;padding:14px}
    .league{color:#00FF88;font-size:11px;font-weight:700;margin-bottom:8px}
    .teams{display:flex;justify-content:space-between;align-items:center}
    .team{display:flex;align-items:center;gap:8px}
    .logo-img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#333}
    .team-name{font-weight:700;font-size:14px}
    .time{font-size:12px;color:#888;margin-left:40px}
    .odds{display:flex;gap:6px;margin-top:10px}
    .odd-btn{flex:1;background:#222;padding:10px;text-align:center;border-radius:8px;cursor:pointer}
    .odd-btn:active{background:#00FF88;color:#000}
    .odd-label{font-size:12px}
    .odd-num{color:#00FF88;font-weight:900;font-size:16px}
    .betslip{position:fixed;bottom:60px;width:100%;background:#1a1a1a;padding:10px;border-top:2px solid #00FF88;display:none}
    .betslip.show{display:block}
    .bottom-nav{position:fixed;bottom:0;width:100%;display:flex;background:#141414;padding:8px 0;border-top:1px solid #222}
    .bottom-item{flex:1;text-align:center;font-size:11px;color:#888}
    .bottom-item.active{color:#00FF88}
    .popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#222;padding:20px;border-radius:12px;display:none;z-index:20}
    .popup.show{display:block}
    input{background:#333;color:white;border:none;padding:10px;border-radius:8px;width:200px;margin:10px 0}
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🔥 SBET</div>
    <div>
      <button class="btn" onclick="showDeposit()">Deposit</button>
      <button class="btn" onclick="showWithdraw()">Withdraw</button>
    </div>
    <div class="balance" id="balance">GHS 1,250.00</div>
  </div>

  <div class="nav">
    <div class="nav-item active">All Sports</div>
    <div class="nav-item">Live</div>
    <div class="nav-item">Football</div>
    <div class="nav-item">Basketball</div>
  </div>

  <div class="tabs">
    <div class="tab active">TODAY'S FOOTBALL</div>
    <div class="tab">LIVE</div>
    <div class="tab">FEATURED</div>
  </div>

  <div class="match-card">
    <div class="league">🔥 Football - Portugal - Liga Portugal</div>
    <div class="teams">
      <div class="team">
        <img src="https://flagcdn.com/w40/pt.png" class="logo-img">
        <div class="team-name">Santa Clara</div>
      </div>
      <div style="color:#888;font-weight:700">1X2</div>
      <div class="team">
        <div class="team-name">Nacional</div>
        <img src="https://flagcdn.com/w40/pt.png" class="logo-img">
      </div>
    </div>
    <div class="time">23:15 Today</div>
    <div class="odds">
      <div class="odd-btn" onclick="addBet('Santa Clara',1.97)"><div class="odd-label">1</div><div class="odd-num">1.97</div></div>
      <div class="odd-btn" onclick="addBet('Draw',3.24)"><div class="odd-label">X</div><div class="odd-num">3.24</div></div>
      <div class="odd-btn" onclick="addBet('Nacional',4.67)"><div class="odd-label">2</div><div class="odd-num">4.67</div></div>
    </div>
  </div>

  <div id="betslip" class="betslip">
    <div id="bet-items"></div>
    <button style="width:100%;background:#00FF88;color:#000;padding:12px;border:none;border-radius:8px;font-weight:900;margin-top:10px" onclick="placeBet()">PLACE BET GHS 10</button>
  </div>

  <div id="depositPopup" class="popup">
    <h3>Deposit Money</h3>
    <input type="number" id="depositAmount" placeholder="Enter GHS Amount">
    <button style="background:#00FF88;color:#000;border:none;padding:10px;width:100%;border-radius:8px" onclick="doDeposit()">DEPOSIT</button>
    <button style="background:#333;color:white;border:none;padding:10px;width:100%;border-radius:8px;margin-top:5px" onclick="hidePopup()">CANCEL</button>
  </div>

  <div id="withdrawPopup" class="popup">
    <h3>Withdraw Money</h3>
    <input type="number" id="withdrawAmount" placeholder="Enter GHS Amount">
    <button style="background:#E10600;color:white;border:none;padding:10px;width:100%;border-radius:8px" onclick="doWithdraw()">WITHDRAW</button>
    <button style="background:#333;color:white;border:none;padding:10px;width:100%;border-radius:8px;margin-top:5px" onclick="hidePopup()">CANCEL</button>
  </div>

  <div class="bottom-nav">
    <div class="bottom-item active">🏠<br>Home</div>
    <div class="bottom-item">🎮<br>Games</div>
    <div class="bottom-item">📋<br>Open Bets</div>
    <div class="bottom-item">👤<br>Me</div>
  </div>

<script>
let balance = 1250;
let betslip = [];

function updateBalance() {
  document.getElementById('balance').innerText = 'GHS ' + balance.toFixed(2);
}

function addBet(team, odds) {
  betslip.push(team + ' @ ' + odds);
  document.getElementById('betslip').classList.add('show');
  document.getElementById('bet-items').innerHTML = betslip.join('<br>');
}

function placeBet() {
  if(balance >= 10) {
    balance -= 10;
    updateBalance();
    alert('Bet Placed for GHS 10!');
    betslip = [];
    document.getElementById('betslip').classList.remove('show');
  } else {
    alert('Not enough balance! Deposit first');
  }
}

function showDeposit() {document.getElementById('depositPopup').classList.add('show');}
function showWithdraw() {document.getElementById('withdrawPopup').classList.add('show');}
function hidePopup() {
  document.getElementById('depositPopup').classList.remove('show');
  document.getElementById('withdrawPopup').classList.remove('show');
}
function doDeposit() {
  let amount = parseFloat(document.getElementById('depositAmount').value);
  if(amount > 0) {balance += amount; updateBalance(); hidePopup(); alert('GHS ' + amount + ' Deposited!');}
function doWithdraw() {
  let amount = parseFloat(document.getElementById('withdrawAmount').value);
  if(amount > 0 && amount <= balance) {balance -= amount; updateBalance(); hidePopup(); alert('GHS ' + amount + ' Withdrawn!');}
  else {alert('Not enough balance');}
</script>
</body>
</html>
