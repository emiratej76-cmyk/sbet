    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBET 2.0</title>
  <style>
    body{background:#0f2027;color:white;font-family:Arial;margin:0;padding:20px}
    h1{color:#00ff88;text-align:center;font-size:40px}
    .container{max-width:700px;margin:auto}
    .card{background:#1a2e35;padding:20px;border-radius:10px;margin:15px 0}
    .btn{background:#00ff88;color:#000;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;width:100%;margin:5px 0;cursor:pointer;font-size:16px}
    .btn:hover{background:#00cc6a}
    .btn-red{background:#ff4444;color:white}
    .odds{display:flex;justify-content:space-between;margin:8px 0}
    input{width:100%;padding:10px;border-radius:8px;border:none;margin:5px 0;background:#2a3e45;color:white}
    .balance{font-size:24px;color:#00ff88;text-align:center}
    .history{font-size:14px;color:#aaa}
    .success{color:#00ff88;font-weight:bold}
  </style>
</head>
<body>
  <div class="container">
    <h1>🔥 SBET 2.0 🔥</h1>
    
    <div class="card">
      <h2>Your Account</h2>
      <input type="text" id="username" placeholder="Enter Username">
      <button class="btn" onclick="login()">LOGIN</button>
      <p class="balance" id="balance">Balance: $1,250.00</p>
      <input type="number" id="deposit" placeholder="Deposit Amount $">
      <button class="btn" onclick="deposit()">💰 DEPOSIT</button>
      <button class="btn btn-red" onclick="withdraw()">WITHDRAW</button>
    </div>

    <div class="card">
      <h2>🔴 LIVE: Man United vs Liverpool</h2>
      <div class="odds"><span>Man United Win</span><span style="color:#00ff88">2.10</span></div>
      <button class="btn" onclick="placeBet('Man United', 2.10)">BET $10</button>
      
      <div class="odds"><span>Draw</span><span style="color:#00ff88">3.40</span></div>
      <button class="btn" onclick="placeBet('Draw', 3.40)">BET $10</button>

      <div class="odds"><span>Liverpool Win</span><span style="color:#00ff88">3.00</span></div>
      <button class="btn" onclick="placeBet('Liverpool', 3.00)">BET $10</button>
    </div>

    <div class="card">
      <h2>🏀 NBA: Lakers vs Warriors</h2>
      <div class="odds"><span>Lakers</span><span style="color:#00ff88">1.90</span></div>
      <button class="btn" onclick="placeBet('Lakers', 1.90)">BET $10</button>
    </div>

    <div class="card">
      <h2>🏏 Cricket: India vs Australia</h2>
      <div class="odds"><span>India</span><span style="color:#00ff88">1.85</span></div>
      <button class="btn" onclick="placeBet('India', 1.85)">BET $10</button>
    </div>

    <div class="card">
      <h2>📜 Bet History</h2>
      <div id="history" class="history">No bets yet</div>
    </div>

    <p id="message" class="success" style="text-align:center"></p>
  </div>

<script>
let balance = 1250;
let history = [];

function updateBalance() {
  document.getElementById('balance').innerText = 'Balance: $' + balance.toFixed(2);
}

function login() {
  let user = document.getElementById('username').value;
  if(user) document.getElementById('message').innerText = 'Welcome ' + user + '!';
}

function deposit() {
  let amount = parseFloat(document.getElementById('deposit').value);
  if(amount > 0) {
    balance += amount;
    updateBalance();
    document.getElementById('message').innerText = '$' + amount + ' Deposited!';
  }
}

function withdraw() {
  document.getElementById('message').innerText = 'Withdrawal requested!';
}

function placeBet(team, odds) {
  if(balance >= 10) {
    balance -= 10;
    updateBalance();
    let bet = 'Bet $10 on ' + team + ' @ ' + odds;
    history.unshift(bet);
    document.getElementById('history').innerHTML = history.slice(0,5).join('<br>');
    document.getElementById('message').innerText = 'Bet Placed: ' + team + '!';
  } else {
    document.getElementById('message').innerText = 'Not enough balance!';
  }
}
</script>
</body>
</html>
