<!DOCTYPE html>
<html>
<head>
    <title>SBET</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!-- RED TOP BAR -->
<div class="header">
    <h1>SBET</h1>
    <div class="wallet-top">GHS <span id="wallet-balance">0.00</span></div>
</div>

<!-- TABS -->
<div class="tabs">
    <button class="tab active">Open Bets (0)</button>
    <button class="tab">Bet History</button>
</div>

<!-- FILTERS -->
<div class="filters">
    <button class="filter active">All</button>
    <button class="filter">Cashout Available</button>
    <button class="filter">Live Games</button>
</div>

<!-- OPEN BET CARD EXAMPLE -->
<div class="bet-card">
    <div class="bet-header">
        <b>Multiple</b>
        <span class="rebet">↻ Rebet</span>
    </div>
    <div class="bet-body">
        <div>
            <p><b>Arsenal vs Chelsea</b></p>
            <p class="stake">Stake <b>GHS 20.00</b></p>
        </div>
        <button class="cashout">Cashout<br>GHS 35.00</button>
    </div>
</div>

<!-- BOTTOM MENU -->
<div class="bottom-menu">
    <div>⚽<br>Sports</div>
    <div>≡<br>Menu</div>
    <div>🎮<br>Games</div>
    <div>💰<br>Bets</div>
    <div>👤<br>Me</div>
</div>

<script src="script.js"></script>
</body>
</html>
