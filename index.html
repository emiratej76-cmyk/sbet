<!DOCTYPE html>
<html>
<head>
    <title>SBET</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!-- RED HEADER -->
<div class="header">
    <h1>SBET</h1>
    <div class="wallet-top">GHS <span id="wallet-balance">0.00</span></div>
</div>

<!-- DEPOSIT + WITHDRAW -->
<div style="background:#e00000; padding:10px;">
    <button onclick="deposit()" style="width:100%; background:#00a651; color:white; border:none; padding:12px; border-radius:5px; font-weight:bold;">Deposit</button>
    <button onclick="withdraw()" style="width:100%; background:#333; color:white; border:none; padding:12px; border-radius:5px; font-weight:bold; margin-top:8px;">Withdraw</button>
</div>

<!-- GAMES -->
<h2 style="padding:10px;">⚽ Popular Games</h2>

<div class="bet-card">
    <p><b>Arsenal vs Chelsea</b></p>
    <p>Home 1.90 | Draw 3.40 | Away 2.10</p>
    <button onclick="placeBet(20)" style="width:100%; background:#e00000; color:white; border:none; padding:10px; border-radius:5px;">Bet GHS 20</button>
</div>

<div class="bet-card">
    <p><b>Man Utd vs Liverpool</b></p>
    <p>Home 2.50 | Draw 3.20 | Away 1.85</p>
    <button onclick="placeBet(20)" style="width:100%; background:#e00000; color:white; border:none; padding:10px; border-radius:5px;">Bet GHS 20</button>
</div>

<!-- BOTTOM MENU -->
<div class="bottom-menu">
    <div onclick="alert('Sports')">⚽<br>Sports</div>
    <div onclick="alert('Menu')">≡<br>Menu</div>
    <div onclick="alert('Games')">🎮<br>Games</div>
    <div onclick="showBets()">💰<br>Bets</div>
    <div onclick="alert('Me')">👤<br>Me</div>
</div>

<script src="script.js"></script>
</body>
</html>
