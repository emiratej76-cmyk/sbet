<!DOCTYPE html>
<html>
<head>
    <title>SBET Predictions</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin:0; font-family: Arial; background:#f5f5f5; padding-bottom:120px; }
   .header { background:#00a651; color:white; padding:12px; display:flex; justify-content:space-between; align-items:center; }
   .wallet-top { font-weight:bold; color:#ffd700; }
   .prize-banner { background:linear-gradient(45deg,#ffd700,#ff8c00); color:#000; padding:12px; text-align:center; font-weight:bold; }
   .match-card { background:#fff; margin:10px; padding:12px; border-radius:10px; }
   .odds-row { display:flex; justify-content:space-between; margin-top:12px; gap:8px; }
   .odd-btn { flex:1; background:#f0f0f0; padding:10px 0; border-radius:6px; font-weight:bold; text-align:center; border:none; cursor:pointer; }
   .odd-btn:hover { background:#00a651; color:white; }
   .odd-btn span { color:#00a651; font-size:16px; display:block; }
   .bottom-menu { position:fixed; bottom:0; width:100%; background:white; display:flex; justify-content:space-around; padding:8px 0; border-top:1px solid #ddd; }
   .bottom-menu div { text-align:center; font-size:11px; }
   .ad-space { background:#ddd; margin:10px; height:50px; text-align:center; line-height:50px; color:#666; }
    </style>
</head>
<body>
<div class="header">
  <h1>SBET PREDICT</h1>
  <div class="wallet-top">COINS: <span id="wallet-balance">10000</span></div>
</div>

<div class="prize-banner">🏆 THIS WEEK: Win GHS 50 Airtime! Top 3 on Leaderboard</div>
<div class="ad-space">AD SPACE - You earn here</div>

<div id="main-content">
<h2 style="padding:10px;">Today's Predictions</h2>
<div class="match-card">
    <p style="font-size:12px; color:#666;">Premier League</p>
    <div style="display:flex; justify-content:space-between;"><div>🏴 Arsenal</div><div><b>19:00</b><br>Today</div><div>🇧🇪 Man City</div></div>
    <div class="odds-row">
        <button class="odd-btn" onclick="placePrediction('Arsenal Win', 2.10)">1<br><span>2.10</span></button>
        <button class="odd-btn" onclick="placePrediction('Draw', 3.40)">X<br><span>3.40</span></button>
        <button class="odd-btn" onclick="placePrediction('Man City Win', 2.80)">2<br><span>2.80</span></button>
    </div>
</div>
</div>

<div class="bottom-menu">
    <div>⚽<br>Predict</div>
    <div onclick="alert('Coming Soon')">🏆<br>Leaderboard</div>
    <div onclick="alert('Invite friends')">👥<br>Invite</div>
    <div onclick="alert('Win Prizes')">🎁<br>Prizes</div>
</div>

<script>
let walletBalance = parseFloat(localStorage.getItem("sbetCoins")) || 10000;
let predictions = JSON.parse(localStorage.getItem("sbetPreds")) || [];
function updateWallet(){document.getElementById("wallet-balance").innerText = walletBalance.toLocaleString();}
function placePrediction(game, odds){walletBalance -= 100; predictions.push({game, odds, stake:100}); localStorage.setItem("sbetCoins",walletBalance); localStorage.setItem("sbetPreds",JSON.stringify(predictions)); alert("Prediction Placed! -100 Coins\n"+game+" @ "+odds); updateWallet();}
updateWallet();
</script>
</body>
</html>
