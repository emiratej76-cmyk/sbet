<!-- BET SLIP - SLIDES UP FROM BOTTOM -->
<div id="betslip" style="display:none; position:fixed; bottom:70px; left:0; width:100%; background:#222; color:white; z-index:998; border-radius:10px 10px 0 0;">
    <div style="background:#333; padding:10px; display:flex; justify-content:space-between;">
        <div><span style="background:green; padding:3px 8px; border-radius:5px;">1</span> REAL</div>
        <span onclick="closeBetslip()" style="font-size:20px;">X</span>
    </div>
    
    <div style="display:flex;">
        <div class="bet-tab active">Single</div>
        <div class="bet-tab">Multiple</div>
        <div class="bet-tab">System</div>
    </div>
    
    <div id="betslip-games" style="background:#2a2a2a; padding:10px;">
        <!-- Games will appear here -->
    </div>
    
    <div style="padding:10px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <span>Stake</span>
            <input id="betslip-stake" type="number" placeholder="min. 0.10" style="width:100px; padding:5px;">
        </div>
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <button onclick="setStake(3)">+3</button>
            <button onclick="setStake(5)">+5</button>
            <button onclick="setStake(10)">+10</button>
        </div>
    </div>
    
    <div style="display:flex;">
        <button style="flex:1; background:green; color:white; border:none; padding:15px;" onclick="placeBetFromSlip()">Place Bet</button>
    </div>
</div>
